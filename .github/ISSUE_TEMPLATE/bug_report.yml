name: Bug report
description: Report incorrect Flow detection or overlay behavior.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.6"
    validations:
      required: true
  - type: input
    id: options
    attributes:
      label: Logi Options+ version
    validations:
      required: true
  - type: input
    id: mouse
    attributes:
      label: Mouse and connection
      placeholder: "MX Master 3S via Bolt receiver"
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display arrangement
      description: Include the display count and their relative positions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic log
      description: Paste only the relevant lines and remove private information.
      render: text

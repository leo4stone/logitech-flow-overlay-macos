name: Feature request
description: Suggest an improvement to the menu bar app or overlay.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should the change solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe the result you expect.
    validations:
      required: true
